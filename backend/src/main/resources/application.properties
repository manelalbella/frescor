server.port=${PORT:8080}
spring.application.name=frescor-api

# --- Base de datos ---------------------------------------------------------
# H2 en ARCHIVO: los datos (usuarios y pedidos) se guardan en backend/data/
# y NO se pierden al reiniciar. Para PostgreSQL usa el perfil "postgres".
spring.datasource.url=jdbc:h2:file:./data/frescor;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# --- Aplicación ------------------------------------------------------------
# Origen permitido (CORS) - front en desarrollo
app.cors.allowed-origins=http://localhost:5173
# Envío gratis a partir de (EUR) y coste de envío estándar
app.shipping.free-threshold=50.00
app.shipping.cost=4.90
# Días que dura una sesión iniciada
app.auth.token-days=30
